# KISS-SLAM Configuration for indoor environments
# Optimized for Livox LiDAR data

out_dir: slam_output

odometry:
  preprocessing:
    max_range: 50.0  # Maximum LiDAR range in meters (indoor setting)
    min_range: 0.5   # Minimum range to filter out body/sensor points

local_mapper:
  voxel_size: 0.5          # Voxel size for local map (meters)
  splitting_distance: 20.0  # Distance to create new local map node (meters)

loop_closer:
  overlap_threshold: 0.4   # Overlap threshold for loop closure detection

occupancy_mapper:
  resolution: 0.5          # Occupancy grid resolution
  z_min: 0.1               # Minimum height for 2D occupancy grid
  z_max: 2.0               # Maximum height for 2D occupancy grid

pose_graph_optimizer:
  max_iterations: 10       # Maximum optimization iterations
